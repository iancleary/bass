name: publish

# The only workflow that can read CARGO_REGISTRY_TOKEN.
#
# Triggers: a push of a tag whose name matches v*, and nothing else. Branch
# pushes, pull requests, and pull_request_target do not run this file, so a
# pull request cannot publish and cannot read the token from this workflow.
# Forks do not receive the upstream secret. The publish job also refuses
# every repository other than iancleary/bass, and it refuses a ref that is
# not a v* tag.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build project
        run: cargo build --release

      - name: Run tests
        run: cargo test --all-features

  publish:
    needs: verify
    if: github.repository == 'iancleary/bass' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.83.0

      - name: Publish to crates.io
        # The token is mapped only in this step, only in this job, and only
        # after the job condition has matched a v* tag in iancleary/bass.
        # The verify job above does not receive the token.
        run: cargo publish --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
