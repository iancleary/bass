name: CI

# Pushes to main, and pull requests targeting main. Tag pushes do not match
# `branches`, so this workflow does not run because a tag was pushed.
# This workflow does not request CARGO_REGISTRY_TOKEN and does not publish.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

# Fork pull requests receive no repository secrets. This file does not use
# pull_request_target, which would run in the base repository and could see secrets.
permissions:
  contents: read

jobs:
  ci:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build project
        run: cargo build --release

      - name: Run tests
        run: cargo test --all-features
